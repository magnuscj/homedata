# nginx reverse proxy for the eds pod — permanent "edge" that recovers the real
# client IP that kubectl port-forward / NodePort SNAT would otherwise hide.
#
# Traffic path:
#   client -> TUF-AX5400 router NAT :8090 -> THIS nginx (host) -> NodePort 30164 -> eds pod :80
#
# Why this exists: the eds pod sits behind minikube-on-Docker. The node IP
# (192.168.49.2) is not reachable from the LAN router, so external traffic used
# to arrive via `kubectl port-forward`, which is an L4 loopback tunnel and logs
# every visitor as 127.0.0.1. nginx terminates HTTP here (where the router NAT
# still carries the real source IP), logs it, filters internal addresses, and
# forwards X-Forwarded-For to Apache in the pod.
#
# This file is mounted into the nginx container at
# /etc/nginx/conf.d/default.conf (see eds-proxy.service).

# Flag internal/LAN source addresses -> $is_internal = 1 (skip logging).
map $remote_addr $is_internal {
    default                            0;
    "~^127\."                          1;   # loopback
    "~^10\."                           1;   # RFC1918 10.0.0.0/8
    "~^192\.168\."                     1;   # RFC1918 192.168.0.0/16
    "~^172\.(1[6-9]|2[0-9]|3[0-1])\."  1;   # RFC1918 172.16.0.0/12
    "~^169\.254\."                     1;   # link-local
}

# access_log if= logs only when the value is non-empty, so invert:
# external clients -> "1" (log), internal -> "" (skip).
map $is_internal $is_external {
    1       "";
    default "1";
}

log_format realip '$remote_addr - [$time_local] "$request" $status '
                  '"$http_referer" "$http_user_agent"';

server {
    listen 8090;

    # Real external client IPs only; internal/LAN traffic is filtered out.
    access_log /var/log/nginx/eds_access.log realip if=$is_external;
    error_log  /var/log/nginx/eds_error.log warn;

    location / {
        # NodePort of eds-ext-nordenort-service on the minikube node. Reachable
        # from this host directly, so no kubectl port-forward is needed.
        proxy_pass http://192.168.49.2:30164;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
