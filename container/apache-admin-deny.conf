# apache-admin-deny.conf
#
# Defence-in-depth: deny serving the DB-mutating admin pages entirely. These
# pages (sensorcfg.php, create_ips.php) are administrative and must never be
# reachable through the public port-forward. On 2026-09-30 a crawler reached
# sensorcfg.php via the external port-forward and wiped the sensorconfig table
# by following its action links. sensorcfg.php now also requires POST+CSRF for
# mutations, but we additionally refuse to serve the pages at all so they are
# not exposed. Administer via `kubectl exec` (localhost inside the pod) or a
# LAN-only path if one is added later.
#
# NOTE: with kubectl port-forward, all requests arrive as 127.0.0.1 and there
# is no X-Forwarded-For, so IP-based allow/deny cannot distinguish LAN from
# external. Hence a blanket deny rather than an allow-LAN rule.
<FilesMatch "^(sensorcfg|create_ips)\.php$">
    Require all denied
</FilesMatch>
