<html>
    <head>
    </head>
    
    <body bgcolor="#100A00"> 
    
	   <div style="position: absolute; left: 5px; top: 3px;">
              <img id="p1" src='picture//homeAuto_report.png' align ="top"/>
	   </div>
	   <div style="position: absolute; left: 5px; top: 318px;">
              <img id="p2" src='picture//wind.png' align ="top"/>
	   </div>
           <div style="position: absolute; left: 297px; top: 210px;">
              <img id="p3" src='picture//status.png' align ="top"/>
	   </div>
	   <div style="position: absolute; left: 297px; top: 318px;">
	     <canvas id="wdcanvas" width="109" height="109"></canvas>
	   </div>

    	<div style="position: absolute; left: 405px; top: 3px;">
         <img id="p5" src='picture//homeAutoGraphMob4.png' align ="top"/>
    	</div>

    	<div style="position: absolute; left: 405px; top: 222px;">
         <img id="p6" src='picture//homeAuto_pedo_Bar.png' align ="top"/>
    	</div>

<script>
const imgs = [
  [p1, 'picture/homeAuto_report.png'],
  [p2, 'picture/wind.png'],
  [p3, 'picture/status.png'],
  [p5, 'picture/homeAutoGraphMob4.png'],
  [p6, 'picture/homeAuto_pedo_Bar.png'],
];

async function refresh() {
  const ts = '?t=' + Date.now();
  const blobs = await Promise.all(
    imgs.map(([, src]) => fetch(src + ts).then(r => r.blob()))
  );
  const urls = blobs.map(b => URL.createObjectURL(b));
  imgs.forEach(([el], i) => {
    URL.revokeObjectURL(el.src);
    el.src = urls[i];
  });
}

setInterval(refresh, 300000);

const canvas = document.getElementById('wdcanvas');
const ctx = canvas.getContext('2d');
const W = 109, cx = 54, cy = 54, R = 46;
let currentAngle = 0, targetAngle = 0, speed = '';

function drawCompass() {
  ctx.clearRect(0, 0, W, W);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, W);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#222';
  ctx.fill();
  const labels = { 0: 'N', 90: 'O', 180: 'S', 270: 'V' };
  for (let deg_M = 0; deg_M < 360; deg_M += 18) {
    const rad = (90 - deg_M) * Math.PI / 180;
    const isCardinal = deg_M % 90 === 0;
    if (!isCardinal) {
      ctx.beginPath();
      ctx.moveTo(cx + R * 0.78 * Math.cos(rad), cy - R * 0.78 * Math.sin(rad));
      ctx.lineTo(cx + R * 0.92 * Math.cos(rad), cy - R * 0.92 * Math.sin(rad));
      ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#bbbbbb';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labels[deg_M], cx + R * 0.82 * Math.cos(rad), cy - R * 0.82 * Math.sin(rad));
    }
  }
  const needleRad = currentAngle * Math.PI / 180;
  const perpRad = needleRad + Math.PI / 2;
  const tipR = R * 0.78, baseR = R * 0.12;
  ctx.beginPath();
  ctx.moveTo(cx + baseR * Math.cos(perpRad),          cy - baseR * Math.sin(perpRad));
  ctx.lineTo(cx + tipR  * Math.cos(needleRad),        cy - tipR  * Math.sin(needleRad));
  ctx.lineTo(cx - baseR * Math.cos(perpRad),          cy + baseR * Math.sin(perpRad));
  ctx.lineTo(cx - baseR * 0.5 * Math.cos(needleRad), cy + baseR * 0.5 * Math.sin(needleRad));
  ctx.closePath(); ctx.fillStyle = '#6495ED'; ctx.fill();
  if (speed) {
    ctx.font = 'bold 14px Arial'; ctx.fillStyle = '#aaaaaa';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(speed + ' m/s', cx, cy + R * 0.35);
  }
}

function shortestArc(from, to) {
  let diff = ((to - from) % 360 + 360) % 360;
  if (diff > 180) diff -= 360;
  return diff;
}

function animate() {
  const diff = shortestArc(currentAngle, targetAngle);
  if (Math.abs(diff) > 0.5) {
    currentAngle += Math.sign(diff) * Math.min(0.5, Math.abs(diff));
    currentAngle = ((currentAngle % 360) + 360) % 360;
  }
  drawCompass();
  requestAnimationFrame(animate);
}

async function pollWind() {
  try {
    const [dRes, sRes] = await Promise.all([
      fetch('picture/winddir.txt?t=' + Date.now()),
      fetch('picture/windspeed.txt?t=' + Date.now())
    ]);
    const deg = parseFloat(await dRes.text());
    const spd = (await sRes.text()).trim();
    if (!isNaN(deg)) targetAngle = ((90 - deg) % 360 + 360) % 360;
    speed = spd;
  } catch (e) {}
}

animate(); pollWind(); setInterval(pollWind, 10000);
</script>
    </body>
</html>
