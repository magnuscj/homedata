apiVersion: apps/v1
kind: Deployment
metadata:
  name: eds-deployment
  labels:
    app: eds
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: eds
  template:
    metadata:
      labels:
        app: eds
    spec:
      volumes:
        - name: eds-pv-storage
          persistentVolumeClaim:
            claimName: eds-pv-claim
      automountServiceAccountToken: true

      initContainers:
      - name: seed-ips
        image: magnuscj/eds:REPLACE
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c", "mkdir -p /usr/storage/ips && [ ! -f /usr/storage/ips/ips.txt ] && cp /img/ips.txt /usr/storage/ips/ips.txt || true; touch /usr/storage/sensorconfig.sql && chown www-data:www-data /usr/storage/sensorconfig.sql"]
        volumeMounts:
          - mountPath: "/usr/storage"
            name: eds-pv-storage

      containers:
      - name: eds
        image: magnuscj/eds:REPLACE
        imagePullPolicy: IfNotPresent
        command: ["./start.sh"]
        env:
          # DB password is injected from the 'eds-db' Secret (created out-of-band
          # per cluster: kubectl create secret generic eds-db --from-literal=...).
          # start.sh uses it to CREATE USER and to render config.txt /
          # edsServerHandlerConf.txt at boot, so the secret is never in git or
          # the image. See .kiro skill "secrets" section.
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: eds-db
                key: db-password
          # SMTP password for the collector's mail alerts. Optional: marked
          # optional so the pod still starts if the key is absent (SMTP just
          # won't authenticate). Same 'eds-db' Secret.
          - name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: eds-db
                key: smtp-password
                optional: true
        ports:
          - containerPort: 80
            name: eds-cont-port
        volumeMounts:
          - mountPath: "/usr/storage"
            name: eds-pv-storage
        lifecycle:
          postStart:
            exec:
              command: ["/bin/bash", "-c", "echo Hello from the postStart handler > /usr/storage/message"]
          preStop:
             exec:
               command: ["/bin/bash","-c","./backup.sh"]
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - ../../liveness.sh
          initialDelaySeconds: 120
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eds-ext-nordenort-service
spec:
  selector:
    app: eds
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: eds-cont-port
      nodePort: 30164

